name: Importer and map tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-import.txt
      - run: python -m unittest discover -s tests -v
      - name: Reject tracked source workbooks
        run: |
          python - <<'PY'
          import subprocess
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          assert not any(n.lower().endswith(('.xlsx', '.xlsm', '.xls')) for n in names), 'Source workbook must not be tracked'
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:map
